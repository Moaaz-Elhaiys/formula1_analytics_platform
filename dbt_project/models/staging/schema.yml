version: 2

models:
  - name: stg_laps
    description: "Staging table for laps data from OpenF1"
    config:
      tags: ['staging', 'laps']
    columns:
      - name: schema_version
        description: "Schema version identifier"
        data_type: int
      - name: source_endpoint
        description: "Source endpoint path"
        data_type: string
      - name: meeting_key
        description: "Meeting key identifier"
        data_type: int
      - name: session_key
        description: "Session key identifier"
        data_type: int
      - name: driver_number
        description: "Driver number (nullable for race_control/weather)"
        data_type: int
        constraints:
          nullable: true
      - name: event_time
        description: "Event timestamp"
        data_type: timestamp
      - name: ingest_time
        description: "Data ingestion timestamp"
        data_type: timestamp
      - name: replay_run_id
        description: "Replay run identifier"
        data_type: string
      - name: payload
        description: "Payload data as struct/json"
        data_type: struct
      # Payload columns from laps payload
      - name: lap_number
        description: "Lap number"
        data_type: int
        constraints:
          nullable: false
      - name: lap_duration
        description: "Lap duration"
        data_type: decimal(10,6)
        constraints:
          nullable: false
      - name: sector_1_duration
        description: "Sector 1 duration"
        data_type: decimal(10,6)
        constraints:
          nullable: true
      - name: sector_2_duration
        description: "Sector 2 duration"
        data_type: decimal(10,6)
        constraints:
          nullable: true
      - name: sector_3_duration
        description: "Sector 3 duration"
        data_type: decimal(10,6)
        constraints:
          nullable: true
      - name: speed_trap
        description: "Speed trap value"
        data_type: decimal(10,6)
        constraints:
          nullable: true
      - name: st_speed
        description: "Speed value"
        data_type: decimal(10,6)
        constraints:
          nullable: true
      - name: date_start
        description: "Date and start time"
        data_type: timestamp
        constraints:
          nullable: true
      - name: is_pit_out_lap
        description: "Is pit out lap flag"
        data_type: boolean
        constraints:
          nullable: true
      - name: compound
        description: "Tyre compound"
        data_type: string
        constraints:
          nullable: true
      - name: tyre_life
        description: "Tyre life"
        data_type: int
        constraints:
          nullable: true
      - name: fresh_tyre
        description: "Fresh tyre flag"
        data_type: boolean
        constraints:
          nullable: true

